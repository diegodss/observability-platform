# The suggested rules from docs/metrics.md. Prometheus evaluates them and shows
# them at http://localhost:9090/alerts; no Alertmanager is configured yet, so nothing is sent.
groups:
  - name: education-integration-poc
    rules:
      - alert: TargetSystemUnavailable
        expr: up{job="edw"} == 0
        for: 20s
        labels:
          severity: critical
          service: edw
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }} cannot be scraped"

      - alert: SourceSystemUnavailable
        expr: up{job="technology-one-sm"} == 0
        for: 20s
        labels:
          severity: critical
          service: technology-one-sm
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }} cannot be scraped"

      - alert: AppUnhealthy
        expr: app_up{app=~"technology-one-sm|edw"} == 0
        for: 20s
        labels:
          severity: warning
          source: grafana
        annotations:
          summary: "{{ $labels.app }} is running but its database is unreachable"

      - alert: IntegrationLastRunFailed
        expr: integration_last_run_success == 0 and on(integration) integration_runs_total{outcome="failure"} > 0
        labels:
          severity: critical
          dependency: edw
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }}: latest run failed (target {{ $labels.target }})"

      - alert: IntegrationStale
        labels:
        ci: "{{ $labels.integration_name }}" # edw, technology-one, etc
        team: data-squad
        product: edw
        integration_type: "{{ $labels.type }}" # Student, Curriculum, General
        severity: warning
        annotations:
        summary: "Integration {{ $labels.integration_name }} ({{ $labels.type }}) stale"
        description: "AppEvents - {{ $labels.type }}: no successful run for over 90s"

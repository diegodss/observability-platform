# The suggested rules from docs/metrics.md. Prometheus evaluates them and shows
# them at http://localhost:9090/alerts; no Alertmanager is configured yet, so nothing is sent.
groups:
  - name: education-integration-poc
    rules:
      - alert: TargetSystemUnavailable
        expr: up{job="edw"} == 0
        for: 20s
        labels:
          severity: critical
          service: edw
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }} cannot be scraped"

      - alert: SourceSystemUnavailable
        expr: up{job="technology-one-sm"} == 0
        for: 20s
        labels:
          severity: critical
          service: technology-one-sm
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }} cannot be scraped"

      - alert: AppUnhealthy
        expr: app_up{app=~"technology-one-sm|edw"} == 0
        for: 20s
        labels:
          severity: warning
          source: grafana
        annotations:
          summary: "{{ $labels.app }} is running but its database is unreachable"

      - alert: IntegrationLastRunFailed
        expr: integration_last_run_success == 0 and on(integration) integration_runs_total{outcome="failure"} > 0
        labels:
          severity: critical
          dependency: edw
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }}: latest run failed (target {{ $labels.target }})"

      - alert: IntegrationStale
        expr: time() - integration_last_success_timestamp_seconds > 90
        labels:
          severity: warning
          source: grafana
        annotations:
          summary: "{{ $labels.display_name }}: no successful run for over 90s"

      # =========================================================================
      # CAMADA AZUL: REGRA DINÂMICA COMPACTA (UP == 0)
      # =========================================================================
      - alert: IntegrationWorkerUnavailable
        # Captura dinamicamente qualquer um dos três jobs de appevents que ficar DOWN
        expr: up{job=~"appevents-curriculum|appevents-general|appevents-student"} == 0
        for: 10s
        labels:
          severity: critical
          dependency: edw
          source: grafana
        annotations:
          # Usa o display_name nativo que já existe no seu Prometheus (ex: AppEvents - Student)
          summary: "{{ $labels.display_name }} worker process has stopped"

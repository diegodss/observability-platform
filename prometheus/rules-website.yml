groups:
  - name: website-availability
    rules:
      - alert: BlackboxProbeFailed #Alert for HTTP, TCP, ICMP and DNS
        expr: probe_success{job=~"blackbox-http|blackbox-tcp|blackbox-icmp|blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alvo indisponível: {{ $labels.instance }}"
          description: "The check {{ $labels.job }} {{ $labels.instance }} has been failing for at least 1 minute."

      - alert: WebsiteResponseSlow #Webpage Slow
        expr: probe_duration_seconds{job="blackbox-http"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Website is slow: {{ $labels.instance }}"
          description: "The HTTP probe has been taking more than 3 seconds for the past 5 minutes.."

      - alert: WebsiteCertificateExpiringSoon #Check Certificate Expiration
        expr:
          (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 15 * 24 * 3600
          and (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) > 0
          and probe_success{job="blackbox-http"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring: {{ $labels.instance }}"
          description: "The TLS certificate expires in less than 15 days."

      - alert: BlackboxExporterDown
        expr: up{job=~"blackbox-http|blackbox-tcp|blackbox-icmp|blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox Exporter indisponível"
          description: "Prometheus is unable to collect metrics from the Blackbox Exporter."

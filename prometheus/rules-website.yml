groups:
  - name: website-availability
    rules:
      - alert: BlackboxProbeFailed
        expr: probe_success{job=~"blackbox-http|blackbox-tcp|blackbox-icmp|blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alvo indisponível: {{ $labels.instance }}"
          description: "A verificação {{ $labels.job }} falha há pelo menos 1 minuto."

      - alert: WebsiteResponseSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Site lento: {{ $labels.instance }}"
          description: "O probe HTTP está levando mais de 3 segundos há 5 minutos."

      - alert: WebsiteCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 15 * 24 * 3600
          and (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) > 0
          and probe_success{job="blackbox-http"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Certificado SSL expirando: {{ $labels.instance }}"
          description: "O certificado TLS vence em menos de 15 dias."

      - alert: BlackboxExporterDown
        expr: up{job=~"blackbox-http|blackbox-tcp|blackbox-icmp|blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox Exporter indisponível"
          description: "O Prometheus não consegue coletar métricas do Blackbox Exporter."

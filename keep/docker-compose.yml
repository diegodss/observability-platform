services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keep
      POSTGRES_PASSWORD: keep
      POSTGRES_DB: keep
    volumes:
      - keep-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keep" ]
      interval: 5s
      retries: 10
    networks:
      - default

  backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.54.3
    #image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.36.9
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - DATABASE_CONNECTION_STRING=postgresql://keep:keep@db:5432/keep
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/secret
      - AUTH_TYPE=NO_AUTH
      - KEEP_JWT_SECRET=keep-dev-secret-change-me
      - KEEP_STORE_DBTYPE=postgres
      - KEEP_API_URL=http://backend:8080

      - KEEP_EXTERNAL_URL=http://localhost:3000
    volumes:
      - keep-secrets:/secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - observability-sim
    extra_hosts:
      - "host.docker.internal:host-gateway"
      #- "cmdb.minimac.internal:host-gateway"

  frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.54.3
    #image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.36.9
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - AUTH_TYPE=DB
      - NEXTAUTH_SECRET=keep-dev-secret-change-me
      - NEXTAUTH_URL=http://localhost:3000
      - API_URL=http://backend:8080
      - NEXT_PUBLIC_KEEP_API_URL=http://localhost:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - KEEP_JWT_SECRET=keep-dev-secret-change-me
      - SECRET_MANAGER_TYPE=FILE
    depends_on:
      - backend
    networks:
      - default

volumes:
  keep-db:
  keep-secrets:

networks:
  observability-sim:
    external: true
    name: observability-sim

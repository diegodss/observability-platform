workflow:
  id: grafana-edw-topology-routing
  name: Grafana -> EDW Root Cause Routing & Suppression
  description: Native symptom suppression and single-click Root Cause analysis for EDW and Technology One topologies, with auto-closure
  disabled: false
  triggers:
    - type: alert
      filters:
        - key: labels.source
          value: grafana
  consts: {}
  owners: []
  services: []
  steps: []
  actions:
    # =========================================================================
    # 1. ROOT CAUSE LAYER: EDW
    #    Each rule has its OWN state on the alert (inc_*, arm_*, tkt_*, url_*,
    #    sum_*), so an open ticket in one layer (e.g. APP) never blocks
    #    nor closes the ticket of another layer (e.g. DB).
    #    inc_<layer> = "open" -> a ticket is already open in this layer
    #    any other value (empty, "closed") -> creates one.
    # =========================================================================
    - name: cria-jira-raiz-edw-db
      if: "'{{ alert.status }}' == 'firing' and '{{ alert.inc_edw_db }}' != 'open' and ('edw' in '{{ alert.labels.service }} {{ alert.labels.app }}'.lower() or 'edw' in '{{ alert.description }}'.lower()) and ('unreachable' in '{{ alert.description }}'.lower() or 'database' in '{{ alert.description }}'.lower() or 'db' in '{{ alert.description }}'.lower())"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          board_name: "OPS board"
          issue_type: Task
          summary: "EDW (Database Layer) unavailable"
          description: "🔴 **EDW (Database Layer) unavailable · Root Cause Identified**\n\n| Affected CI | Detalhe |\n| --- | --- |\n| **Affected CI** | EDW (Full Stack Affected) |\n| **Alert message** | {{ alert.description }} |\n| **Resolver** | Data Squad |\n| **Impact** | Downstream integration flow blocks are completely stopped. |\n| **Logs** | [Grafana · Loki: failed runs in this window] |\n\n| Trigger Event | State | Target System |\n| --- | --- | --- |\n| {{ alert.name }} | CRITICAL | EDW |\n"
          enrich_alert:
            - key: inc_edw_db
              value: "open"
            - key: arm_edw_db
              value: "yes"
            - key: tkt_edw_db
              value: results.issue.key
            - key: url_edw_db
              value: results.ticket_url
            - key: sum_edw_db
              value: "EDW (Database Layer) unavailable"

    - name: cria-jira-raiz-edw-app
      if: "'{{ alert.status }}' == 'firing' and '{{ alert.inc_edw_app }}' != 'open' and ('edw' in '{{ alert.labels.service }} {{ alert.labels.app }}'.lower() or 'edw' in '{{ alert.description }}'.lower()) and ('scraped' in '{{ alert.description }}'.lower() or 'cannot' in '{{ alert.description }}'.lower()) and 'integrationworker' not in '{{ alert.name }}'.lower()"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          board_name: "OPS board"
          issue_type: Task
          summary: "EDW (Application Layer) issue detected"
          description: "🔴 **EDW (Application Layer) unavailable · Root Cause Identified**\n\n| Affected CI | Detalhe |\n| --- | --- |\n| **Affected CI** | EDW (Full Stack Affected) |\n| **Alert message** | {{ alert.description }} |\n| **Resolver** | Data Squad |\n| **Impact** | Downstream integration flow blocks are completely stopped. |\n| **Logs** | [Grafana · Loki: failed runs in this window] |\n\n| Trigger Event | State | Target System |\n| --- | --- | --- |\n| {{ alert.name }} | CRITICAL | EDW |\n"
          enrich_alert:
            - key: inc_edw_app
              value: "open"
            - key: arm_edw_app
              value: "yes"
            - key: tkt_edw_app
              value: results.issue.key
            - key: url_edw_app
              value: results.ticket_url
            - key: sum_edw_app
              value: "EDW (Application Layer) issue detected"

    # =========================================================================
    # 2. ROOT CAUSE LAYER: TECHNOLOGY ONE (SM)
    # =========================================================================
    - name: cria-jira-raiz-techone-db
      if: "'{{ alert.status }}' == 'firing' and '{{ alert.inc_t1_db }}' != 'open' and ('technology-one' in '{{ alert.name }} {{ alert.description }} {{ alert.labels.service }} {{ alert.labels.app }}'.lower() or 'technology one' in '{{ alert.name }} {{ alert.description }} {{ alert.labels.service }} {{ alert.labels.app }}'.lower()) and ('unreachable' in '{{ alert.description }}'.lower() or 'database' in '{{ alert.description }}'.lower() or 'db' in '{{ alert.description }}'.lower())"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          board_name: "OPS board"
          issue_type: Task
          summary: "technology-one-sm (Database Layer) unavailable"
          description: "🔴 **technology-one-sm (Database Layer) unavailable · Root Cause Identified**\n\n| Affected CI | Detalhe |\n| --- | --- |\n| **Affected CI** | technology-one-sm (Full Stack Affected) |\n| **Alert message** | {{ alert.description }} |\n| **Resolver** | Data Squad |\n| **Impact** | Downstream integration flow blocks are completely stopped. |\n| **Logs** | [Grafana · Loki: failed runs in this window] |\n\n| Trigger Event | State | Target System |\n| --- | --- | --- |\n| {{ alert.name }} | CRITICAL | technology-one-sm |\n"
          enrich_alert:
            - key: inc_t1_db
              value: "open"
            - key: arm_t1_db
              value: "yes"
            - key: tkt_t1_db
              value: results.issue.key
            - key: url_t1_db
              value: results.ticket_url
            - key: sum_t1_db
              value: "technology-one-sm (Database Layer) unavailable"

    - name: cria-jira-raiz-techone-app
      if: "'{{ alert.status }}' == 'firing' and '{{ alert.inc_t1_app }}' != 'open' and ('technology-one' in '{{ alert.name }} {{ alert.description }} {{ alert.labels.service }} {{ alert.labels.app }}'.lower() or 'technology one' in '{{ alert.name }} {{ alert.description }} {{ alert.labels.service }} {{ alert.labels.app }}'.lower()) and ('scraped' in '{{ alert.description }}'.lower() or 'cannot' in '{{ alert.description }}'.lower())"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          board_name: "OPS board"
          issue_type: Task
          summary: "technology-one-sm (Application Layer) issue detected"
          description: "🔴 **technology-one-sm (Application Layer) unavailable · Root Cause Identified**\n\n| Affected CI | Detalhe |\n| --- | --- |\n| **Affected CI** | technology-one-sm (Full Stack Affected) |\n| **Alert message** | {{ alert.description }} |\n| **Resolver** | Data Squad |\n| **Impact** | Downstream integration flow blocks are completely stopped. |\n| **Logs** | [Grafana · Loki: failed runs in this window] |\n\n| Trigger Event | State | Target System |\n| --- | --- | --- |\n| {{ alert.name }} | CRITICAL | technology-one-sm |\n"
          enrich_alert:
            - key: inc_t1_app
              value: "open"
            - key: arm_t1_app
              value: "yes"
            - key: tkt_t1_app
              value: results.issue.key
            - key: url_t1_app
              value: results.ticket_url
            - key: sum_t1_app
              value: "technology-one-sm (Application Layer) issue detected"

    # =========================================================================
    # 3. BLUE LAYER: ISOLATED WORKER
    # =========================================================================
    - name: cria-jira-worker-isolado
      if: "'{{ alert.status }}' == 'firing' and '{{ alert.inc_worker }}' != 'open' and 'integrationworker' in '{{ alert.name }}'.lower()"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          board_name: "OPS board"
          issue_type: Task
          summary: "{{ alert.description }} failure detected"
          description: "⚠️ **{{ alert.description }} Incident · Isolated Failure**\n\n| Affected CI | Detalhe |\n| --- | --- |\n| **Affected CI** | {{ alert.description }} |\n| **Resolver** | Data Squad |\n| **Impact** | Specific integration queue is delayed/stopped. Core infrastructure is healthy. |\n| **Logs** | [Grafana · Loki: check worker logs] |\n\n| Trigger Event | State | Target System |\n| --- | --- | --- |\n| {{ alert.name }} | WARNING | EDW |\n"
          enrich_alert:
            - key: inc_worker
              value: "open"
            - key: arm_worker
              value: "yes"
            - key: tkt_worker
              value: results.issue.key
            - key: url_worker
              value: results.ticket_url
            - key: sum_worker
              value: "{{ alert.description }} failure detected"

    # =========================================================================
    # 4. END OF INCIDENT
    #    4.1 releases ticket creation in ALL layers (does not depend on Jira,
    #        so it runs even if a ticket has been deleted)
    #    4.2 per layer: comments on the ticket and then moves it to Done, only
    #        if this alert opened it (arm_<layer> = "yes"), keeping the
    #        original title. The comment uses credentials in the URL (the
    #        workflow's JIRA_USER and JIRA_TOKEN secrets), because the
    #        Authorization header does not reach Jira through the http provider.
    # =========================================================================
    - name: libera-criacao-apos-resolved
      if: "'{{ alert.status }}' == 'resolved'"
      provider:
        type: mock
        with:
          enrich_alert:
            - key: inc_edw_db
              value: "closed"
            - key: inc_edw_app
              value: "closed"
            - key: inc_t1_db
              value: "closed"
            - key: inc_t1_app
              value: "closed"
            - key: inc_worker
              value: "closed"

    - name: comenta-ticket-edw-db
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_edw_db }}' == 'yes' and '{{ alert.tkt_edw_db }}' not in ('', 'None') and '{{ alert.sum_edw_db }}' not in ('', 'None')"
      provider:
        type: http
        with:
          method: POST
          url: "https://{{ secrets.JIRA_USER }}:{{ secrets.JIRA_TOKEN }}@anotaaideivid.atlassian.net/rest/api/2/issue/{{ alert.tkt_edw_db }}/comment"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          body:
            body: "Alerta resolvido automaticamente pelo Keep. Alerta: {{ alert.name }} - {{ alert.description }}"

    - name: fecha-ticket-edw-db
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_edw_db }}' == 'yes' and '{{ alert.tkt_edw_db }}' not in ('', 'None') and '{{ alert.sum_edw_db }}' not in ('', 'None')"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          issue_id: "{{ alert.tkt_edw_db }}"
          summary: "{{ alert.sum_edw_db }}"
          transition_to: "Feito"
          enrich_alert:
            - key: arm_edw_db
              value: "no"

    - name: comenta-ticket-edw-app
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_edw_app }}' == 'yes' and '{{ alert.tkt_edw_app }}' not in ('', 'None') and '{{ alert.sum_edw_app }}' not in ('', 'None')"
      provider:
        type: http
        with:
          method: POST
          url: "https://{{ secrets.JIRA_USER }}:{{ secrets.JIRA_TOKEN }}@anotaaideivid.atlassian.net/rest/api/2/issue/{{ alert.tkt_edw_app }}/comment"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          body:
            body: "Alerta resolvido automaticamente pelo Keep. Alerta: {{ alert.name }} - {{ alert.description }}"

    - name: fecha-ticket-edw-app
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_edw_app }}' == 'yes' and '{{ alert.tkt_edw_app }}' not in ('', 'None') and '{{ alert.sum_edw_app }}' not in ('', 'None')"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          issue_id: "{{ alert.tkt_edw_app }}"
          summary: "{{ alert.sum_edw_app }}"
          transition_to: "Feito"
          enrich_alert:
            - key: arm_edw_app
              value: "no"

    - name: comenta-ticket-t1-db
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_t1_db }}' == 'yes' and '{{ alert.tkt_t1_db }}' not in ('', 'None') and '{{ alert.sum_t1_db }}' not in ('', 'None')"
      provider:
        type: http
        with:
          method: POST
          url: "https://{{ secrets.JIRA_USER }}:{{ secrets.JIRA_TOKEN }}@anotaaideivid.atlassian.net/rest/api/2/issue/{{ alert.tkt_t1_db }}/comment"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          body:
            body: "Alerta resolvido automaticamente pelo Keep. Alerta: {{ alert.name }} - {{ alert.description }}"

    - name: fecha-ticket-t1-db
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_t1_db }}' == 'yes' and '{{ alert.tkt_t1_db }}' not in ('', 'None') and '{{ alert.sum_t1_db }}' not in ('', 'None')"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          issue_id: "{{ alert.tkt_t1_db }}"
          summary: "{{ alert.sum_t1_db }}"
          transition_to: "Feito"
          enrich_alert:
            - key: arm_t1_db
              value: "no"

    - name: comenta-ticket-t1-app
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_t1_app }}' == 'yes' and '{{ alert.tkt_t1_app }}' not in ('', 'None') and '{{ alert.sum_t1_app }}' not in ('', 'None')"
      provider:
        type: http
        with:
          method: POST
          url: "https://{{ secrets.JIRA_USER }}:{{ secrets.JIRA_TOKEN }}@anotaaideivid.atlassian.net/rest/api/2/issue/{{ alert.tkt_t1_app }}/comment"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          body:
            body: "Alerta resolvido automaticamente pelo Keep. Alerta: {{ alert.name }} - {{ alert.description }}"

    - name: fecha-ticket-t1-app
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_t1_app }}' == 'yes' and '{{ alert.tkt_t1_app }}' not in ('', 'None') and '{{ alert.sum_t1_app }}' not in ('', 'None')"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          issue_id: "{{ alert.tkt_t1_app }}"
          summary: "{{ alert.sum_t1_app }}"
          transition_to: "Feito"
          enrich_alert:
            - key: arm_t1_app
              value: "no"

    - name: comenta-ticket-worker
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_worker }}' == 'yes' and '{{ alert.tkt_worker }}' not in ('', 'None') and '{{ alert.sum_worker }}' not in ('', 'None')"
      provider:
        type: http
        with:
          method: POST
          url: "https://{{ secrets.JIRA_USER }}:{{ secrets.JIRA_TOKEN }}@anotaaideivid.atlassian.net/rest/api/2/issue/{{ alert.tkt_worker }}/comment"
          headers:
            Content-Type: "application/json"
            Accept: "application/json"
          body:
            body: "Alerta resolvido automaticamente pelo Keep. Alerta: {{ alert.name }} - {{ alert.description }}"

    - name: fecha-ticket-worker
      if: "'{{ alert.status }}' == 'resolved' and '{{ alert.arm_worker }}' == 'yes' and '{{ alert.tkt_worker }}' not in ('', 'None') and '{{ alert.sum_worker }}' not in ('', 'None')"
      provider:
        type: jira
        config: "{{ providers.jira_free }}"
        with:
          issue_id: "{{ alert.tkt_worker }}"
          summary: "{{ alert.sum_worker }}"
          transition_to: "Feito"
          enrich_alert:
            - key: arm_worker
              value: "no"

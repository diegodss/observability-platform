      db:
        condition: service_healthy
    networks:
      - default
      #- observability-sim
    extra_hosts:
      - "host.docker.internal:host-gateway"
      #- "cmdb.minimac.internal:host-gateway"

  frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.54.3
    #image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.36.9
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - AUTH_TYPE=NO_AUTH   
      #- AUTH_TYPE=DB
      - NEXTAUTH_SECRET=keep-dev-secret-change-me
      - NEXTAUTH_URL=http://192.168.0.254:3000
      - API_URL=http://backend:8080
      - NEXT_PUBLIC_KEEP_API_URL=http://192.168.0.254:8080
      - NEXT_PUBLIC_API_URL=http://192.168.0.254:8080
      - KEEP_JWT_SECRET=keep-dev-secret-change-me

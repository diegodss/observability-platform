    depends_on:
      - backend
    networks:
      - default



      

# Shared network: both repos declare the same named network, so either stack can
# start or stop first. Whichever starts second logs a harmless warning that the
# network "was not created for project ...": that is expected.
networks:
  default:
    name: observability-sim

volumes:
  prometheus-data:
  grafana-data:
  keep-db:
  keep-secrets:  
